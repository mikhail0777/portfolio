<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="100%" height="auto">
  <defs>
    <style>
      .title { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; fill: #64748b; }
      .box-label { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .pin-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #334155; }
      .wire-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; fill: #475569; }
      .box { rx: 6px; stroke-width: 2px; }
      .wire { stroke-width: 2.5px; fill: none; }
      .dashed-wire { stroke-width: 2px; stroke-dasharray: 4 4; fill: none; }
    </style>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Header -->
  <text x="30" y="40" class="title">BMW S1000RR K67 — External Throttle Interceptor Wiring Schematic</text>
  <text x="30" y="62" class="subtitle">Path 3 Hardware Architecture: Teensy 4.1 + Dual Failsafe DPDT Bypass Relays + CAN-Bus Sniffer</text>

  <!-- 1. Handlebar Twist Grip Sensor (TGS) -->
  <rect x="40" y="110" width="180" height="260" class="box" fill="#ffffff" stroke="#ea580c" />
  <text x="55" y="140" class="box-label" fill="#ea580c">Handlebar Twist Grip</text>
  <text x="55" y="160" class="subtitle">OEM S1000RR TGS</text>
  
  <rect x="180" y="185" width="40" height="20" fill="#fed7aa" rx="3" />
  <text x="185" y="199" class="pin-label">5V</text>
  <rect x="180" y="225" width="40" height="20" fill="#fed7aa" rx="3" />
  <text x="185" y="239" class="pin-label">GND</text>
  <rect x="180" y="265" width="40" height="20" fill="#fed7aa" rx="3" />
  <text x="185" y="279" class="pin-label">APS1</text>
  <rect x="180" y="305" width="40" height="20" fill="#fed7aa" rx="3" />
  <text x="185" y="319" class="pin-label">APS2</text>
  
  <text x="55" y="345" class="wire-label">APS1: 0.75V - 4.15V</text>
  <text x="55" y="360" class="wire-label">APS2: 0.375V - 2.075V</text>

  <!-- 2. Dual DPDT Failsafe Relay Block -->
  <rect x="290" y="110" width="230" height="260" class="box" fill="#f1f5f9" stroke="#475569" />
  <text x="305" y="140" class="box-label">Failsafe Relay (DPDT)</text>
  <text x="305" y="160" class="subtitle">De-energized = OEM Pass-thru</text>

  <!-- Relay Switch Poles -->
  <!-- Pole 1 (APS1) -->
  <circle cx="310" cy="275" r="5" fill="#ea580c" />
  <line x1="315" y1="275" x2="350" y2="260" stroke="#0f172a" stroke-width="3" /> <!-- Common lever -->
  <circle cx="355" cy="255" r="4" fill="#16a34a" /> <text x="365" y="259" class="wire-label">NC (OEM)</text>
  <circle cx="355" cy="285" r="4" fill="#0284c7" /> <text x="365" y="289" class="wire-label">NO (Teensy)</text>
  <circle cx="500" cy="255" r="5" fill="#16a34a" />
  
  <!-- Pole 2 (APS2) -->
  <circle cx="310" cy="315" r="5" fill="#ea580c" />
  <line x1="315" y1="315" x2="350" y2="300" stroke="#0f172a" stroke-width="3" /> <!-- Common lever -->
  <circle cx="355" cy="305" r="4" fill="#16a34a" /> <text x="365" y="309" class="wire-label">NC (OEM)</text>
  <circle cx="355" cy="335" r="4" fill="#0284c7" /> <text x="365" y="339" class="wire-label">NO (Teensy)</text>
  <circle cx="500" cy="305" r="5" fill="#16a34a" />

  <!-- Relay Coil -->
  <rect x="360" y="180" width="70" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8" />
  <text x="375" y="202" class="pin-label">COIL</text>

  <!-- 3. Teensy 4.1 Microcontroller Board -->
  <rect x="290" y="400" width="460" height="190" class="box" fill="#ffffff" stroke="#0284c7" />
  <text x="310" y="430" class="box-label" fill="#0284c7">Teensy 4.1 Controller (Cortex-M7 @ 600 MHz)</text>
  <text x="310" y="450" class="subtitle">Runs 100 Hz Analytical Feedforward PD + Plausibility Cross-Check</text>

  <!-- Teensy Pins -->
  <!-- Inputs -->
  <rect x="290" y="470" width="55" height="18" fill="#e0f2fe" />
  <text x="295" y="483" class="pin-label">A0 (Aps1)</text>
  <rect x="290" y="495" width="55" height="18" fill="#e0f2fe" />
  <text x="295" y="508" class="pin-label">A1 (Aps2)</text>
  <rect x="290" y="520" width="55" height="18" fill="#e0f2fe" />
  <text x="295" y="533" class="pin-label">Pin 4 (Arm)</text>
  
  <!-- Outputs -->
  <rect x="470" y="470" width="65" height="18" fill="#fef3c7" />
  <text x="475" y="483" class="pin-label">DAC1 (A21)</text>
  <rect x="470" y="495" width="65" height="18" fill="#fef3c7" />
  <text x="475" y="508" class="pin-label">DAC2 (A22)</text>
  <rect x="470" y="520" width="65" height="18" fill="#fee2e2" />
  <text x="475" y="533" class="pin-label">Pin 2 (Relay)</text>

  <!-- CAN Transceiver (SN65HVD230) inside Teensy block -->
  <rect x="610" y="470" width="120" height="80" rx="4" fill="#f8fafc" stroke="#64748b" />
  <text x="625" y="495" class="box-label" font-size="11">CAN Transceiver</text>
  <text x="620" y="515" class="pin-label">Pin 0 (CRX1)</text>
  <text x="620" y="535" class="pin-label">Pin 1 (CTX1)</text>

  <!-- 4. Factory BMW BMS-O Engine ECU -->
  <rect x="800" y="110" width="210" height="480" class="box" fill="#0f172a" stroke="#0f172a" />
  <text x="820" y="145" class="box-label" fill="#ffffff">BMW BMS-O OEM ECU</text>
  <text x="820" y="165" class="subtitle" fill="#94a3b8">Retains Fuel, Timing, ShiftCam</text>

  <rect x="800" y="245" width="55" height="20" fill="#334155" />
  <text x="805" y="259" class="pin-label" fill="#ffffff">APS1 In</text>
  <rect x="800" y="295" width="55" height="20" fill="#334155" />
  <text x="805" y="309" class="pin-label" fill="#ffffff">APS2 In</text>

  <rect x="800" y="480" width="55" height="20" fill="#334155" />
  <text x="805" y="494" class="pin-label" fill="#ffffff">CAN-H</text>
  <rect x="800" y="520" width="55" height="20" fill="#334155" />
  <text x="805" y="534" class="pin-label" fill="#ffffff">CAN-L</text>

  <!-- Wiring Paths -->
  <!-- Grip APS1 to Relay Common -->
  <path d="M 220 275 L 305 275" class="wire" stroke="#ea580c" />
  <!-- Grip APS1 tap to Teensy A0 ADC -->
  <path d="M 260 275 L 260 480 L 290 480" class="wire" stroke="#ea580c" />

  <!-- Grip APS2 to Relay Common -->
  <path d="M 220 315 L 305 315" class="wire" stroke="#ea580c" />
  <!-- Grip APS2 tap to Teensy A1 ADC -->
  <path d="M 245 315 L 245 504 L 290 504" class="wire" stroke="#ea580c" />

  <!-- Relay NC to ECU (Passive OEM hardwire when de-energized) -->
  <path d="M 360 255 L 500 255 L 800 255" class="wire" stroke="#16a34a" />
  <path d="M 360 305 L 500 305 L 800 305" class="wire" stroke="#16a34a" />

  <!-- Teensy DAC to Relay NO (Active intercept path) -->
  <path d="M 535 480 L 560 480 L 560 285 L 360 285" class="wire" stroke="#0284c7" />
  <path d="M 535 504 L 580 504 L 580 335 L 360 335" class="wire" stroke="#0284c7" />

  <!-- Teensy Relay Driver Output to Relay Coil -->
  <path d="M 535 528 L 440 528 L 440 215 L 430 215" class="wire" stroke="#dc2626" />

  <!-- CAN Bus (500 kbps) from BMW Chassis Bus to Teensy -->
  <path d="M 800 490 L 730 490" class="wire" stroke="#8b5cf6" marker-end="url(#arr)" />
  <path d="M 800 530 L 730 530" class="wire" stroke="#8b5cf6" marker-end="url(#arr)" />
  <text x="740" y="475" class="wire-label" fill="#8b5cf6">BMW Chassis CAN</text>

  <!-- Legend -->
  <rect x="40" y="400" width="220" height="190" fill="#ffffff" stroke="#cbd5e1" rx="4" />
  <text x="55" y="425" class="box-label" font-size="12">Failsafe Legend</text>
  <line x1="55" y1="450" x2="85" y2="450" stroke="#16a34a" stroke-width="3" />
  <text x="95" y="454" class="wire-label">OEM Relay NC (Passive)</text>
  <line x1="55" y1="480" x2="85" y2="480" stroke="#0284c7" stroke-width="3" />
  <text x="95" y="484" class="wire-label">Teensy Clamped DAC (Active)</text>
  <line x1="55" y1="510" x2="85" y2="510" stroke="#ea580c" stroke-width="3" />
  <text x="95" y="514" class="wire-label">Rider Grip Raw Inputs</text>
  <line x1="55" y1="540" x2="85" y2="540" stroke="#8b5cf6" stroke-width="3" />
  <text x="95" y="544" class="wire-label">CAN Bus Telemetry (100 Hz)</text>
</svg>

